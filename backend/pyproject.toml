[project]
name = "controlplane-api"
version = "0.1.0"
description = "Real-time governance layer for enterprise AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "psycopg[binary]>=3.2.3,<4.0.0",
  "alembic>=1.14.0,<2.0.0",
  "python-jose[cryptography]>=3.3.0,<4.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "bcrypt>=4.0.0,<6.0.0",
  "python-multipart>=0.0.17,<1.0.0",
  "sse-starlette>=2.1.3,<3.0.0",
  "structlog>=24.4.0,<26.0.0",
  "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
  "slowapi>=0.1.9,<1.0.0",
  "httpx>=0.27.2,<1.0.0",
  "litellm>=1.83.0,<2.0.0",
]

[project.optional-dependencies]
ml = ["optimum[onnxruntime]>=1.23.0", "sentence-transformers>=3.3.0", "presidio-analyzer>=2.2.355"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0", "mypy>=1.13.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
